<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>صدقات جارية على أرواح موتانا</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<header class="hero">
  <div class="hero-icon">﷽</div>
  <h1>صدقات جارية على أرواح موتانا</h1>
  <p>شارك في قراءة القرآن واجعل ثوابها صدقة جارية</p>
</header>

<main class="container">
  <section class="toolbar">
    <div>
      <h2>الصدقات الجارية</h2>
      <p id="memorialCount">جاري التحميل...</p>
    </div>
    <button id="addBtn" class="primary">＋ إضافة متوفى / صدقة جارية</button>
  </section>

  <div id="message" class="message hidden"></div>
  <section id="memorials" class="cards"></section>
</main>

<div id="addModal" class="modal hidden">
  <div class="modal-box">
    <button class="close" id="closeAdd">×</button>
    <h2>إضافة صدقة جارية</h2>
    <p>اكتب اسم المتوفى كما تريد أن يظهر للزوار.</p>
    <form id="addForm">
      <label>اسم المتوفى</label>
      <input id="nameInput" required maxlength="120" placeholder="مثال: المرحوم محمد أحمد">
      <button class="primary full" type="submit">إنشاء الصدقة الجارية</button>
    </form>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
