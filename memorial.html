<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>الصدقة الجارية</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<header class="page-head">
  <a href="index.html" class="back">‹ الرئيسية</a>
  <div class="hero-icon small">﷽</div>
  <h1>صدقة جارية على روح</h1>
  <h2 id="memorialName">...</h2>
  <button id="shareBtn" class="share">🔗 مشاركة الصفحة</button>
</header>

<main class="container">
  <section id="stats" class="stats"></section>
  <div id="message" class="message hidden"></div>
  <section class="parts-head">
    <h2>أجزاء القرآن الكريم</h2>
    <p>اختر جزءًا متاحًا واقرأه خلال 5 ساعات.</p>
  </section>
  <section id="parts" class="parts"></section>
</main>

<div id="confirmModal" class="modal hidden">
  <div class="modal-box">
    <h2 id="confirmTitle">⚠️ تأكيد</h2>
    <p id="confirmText"></p>
    <div class="actions">
      <button id="confirmYes" class="danger"></button>
      <button id="confirmNo" class="secondary">لا، الرجوع</button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="memorial.js"></script>
</body>
</html>
